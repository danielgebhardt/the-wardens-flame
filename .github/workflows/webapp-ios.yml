name: Web app and iOS

# The installable web app on GitHub Pages and the unsigned iOS app (see README.md,
# "Install the game"). Every push checks both; pushes to main also deploy the web app and
# attach the .ipa to the `latest` pre-release that the Android app workflow maintains:
# https://danielgebhardt.github.io/the-wardens-flame/
# https://github.com/danielgebhardt/the-wardens-flame/releases/download/latest/wardens-flame.ipa
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: webapp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the web app
        run: pnpm frontend:webapp:build
      - name: Install headless Chromium and runner libraries
        run: pnpm --filter frontend exec playwright install --with-deps --only-shell chromium
      - name: Installable, and boots offline under /the-wardens-flame/
        working-directory: frontend
        run: node scripts/webapp-check.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: frontend/dist

  # iPhone/iPad "Add to Home Screen" and Android "Install app": no signing or expiry.
  pages:
    name: Deploy the web app to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

  # Unsigned, for sideloading with a free Apple ID (Xcode or AltStore re-sign it on
  # install). macOS minutes are free for public repositories.
  ios:
    name: Build the unsigned iOS app
    needs: build
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the offline bundle and sync it into the iOS project
        run: pnpm frontend:ios
      - name: Build the unsigned .ipa
        working-directory: frontend/ios/App
        run: |
          xcodebuild -version
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -quiet build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/wardens-flame.ipa" Payload
          ls -l "$GITHUB_WORKSPACE/wardens-flame.ipa"
      - name: Keep the .ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wardens-flame-ipa
          path: wardens-flame.ipa
          if-no-files-found: error
          retention-days: 30
      # The Android app workflow keeps the `latest` pre-release; this only adds the .ipa.
      - name: Attach the .ipa to the latest pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest wardens-flame.ipa --clobber --repo "$GITHUB_REPOSITORY"
